<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Job details</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<script src="dc-lite.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#0E5E56;text-decoration:none}a:hover{color:#0A4540}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #F6F4EF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #14211F; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 16px 20px 4px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="C2-Subservices.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14211F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
      <h1 style="margin: 0; font-size: 22px; font-weight: 800">Job details</h1>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <div><div style="height: 4px; border-radius: 9px; background: #0E5E56"></div><div style="font-size: 12px; font-weight: 700; color: #0E5E56; margin-top: 6px">1 Details</div></div>
      <div><div style="height: 4px; border-radius: 9px; background: #E4E0D6"></div><div style="font-size: 12px; font-weight: 600; color: #5E6B68; margin-top: 6px">2 Provider</div></div>
      <div><div style="height: 4px; border-radius: 9px; background: #E4E0D6"></div><div style="font-size: 12px; font-weight: 600; color: #5E6B68; margin-top: 6px">3 Review</div></div>
    </div>
  </header>

  <div style="flex-grow: 1; overflow: hidden; padding: 14px 20px; display: flex; flex-direction: column; gap: 18px">
    <section style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between"><h2 style="margin: 0; font-size: 15px; font-weight: 700">Address</h2><a href="#" style="font-size: 14px; font-weight: 600">Change</a></div>
      <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
        <div style="height: 76px; background: #E8E4DA; position: relative; overflow: hidden">
          <div style="position: absolute; left: 0; right: 0; top: 30px; height: 10px; background: #FFFFFF"></div>
          <div style="position: absolute; top: 0; bottom: 0; left: 120px; width: 10px; background: #FFFFFF"></div>
          <div style="position: absolute; top: 0; bottom: 0; left: 260px; width: 8px; background: #FFFFFF"></div>
          <div style="position: absolute; left: 170px; top: 14px; width: 28px; height: 28px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: #0E5E56; border: 3px solid #FFFFFF"></div>
        </div>
        <div style="padding: 12px 14px">
          <div style="font-weight: 700; font-size: 15px">Home</div>
          <div style="font-size: 13px; color: #5E6B68">#24, St. 278, Boeung Keng Kang 1, Phnom Penh</div>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700">Date</h2>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
          <button onClick="{{d.pick}}" aria-pressed="{{d.on}}" style="flex: 1; height: 64px; border-radius: 14px; border: 2px solid {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; cursor: pointer">
            <span style="font-size: 12px; font-weight: 600">{{d.dow}}</span><span style="font-size: 18px; font-weight: 800">{{d.num}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 15px; font-weight: 700">Time</h2><span style="font-size: 12px; color: #5E6B68">At least 1 h ahead</span></div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{slots}}" as="s" hint-placeholder-count="8">
          <button onClick="{{s.pick}}" disabled="{{s.disabled}}" aria-pressed="{{s.on}}" style="height: 44px; border-radius: 12px; border: 2px solid {{s.border}}; background: {{s.bg}}; color: {{s.fg}}; font: 700 14px 'Plus Jakarta Sans', sans-serif; text-decoration: {{s.deco}}; cursor: pointer">{{s.t}}</button>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 15px; font-weight: 700">Photos</h2><span style="font-size: 12px; color: #5E6B68">2 of 5</span></div>
      <div style="display: flex; gap: 8px">
        <div style="width: 72px; height: 72px; border-radius: 14px; background: #C9D6D2; display: flex; align-items: flex-end; padding: 6px; font-size: 11px; font-weight: 600; color: #14211F">Photo</div>
        <div style="width: 72px; height: 72px; border-radius: 14px; background: #D8CFBD; display: flex; align-items: flex-end; padding: 6px; font-size: 11px; font-weight: 600; color: #14211F">Photo</div>
        <button aria-label="Add photo" style="width: 72px; height: 72px; border-radius: 14px; border: 2px dashed #C9C4B8; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5E6B68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </button>
      </div>
    </section>

    <label style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; font-weight: 700">Note for the technician
      <textarea rows="2" style="border: 1.5px solid #E4E0D6; border-radius: 14px; padding: 12px; font: 400 14px 'Plus Jakarta Sans', sans-serif; color: #14211F; resize: none; background: #FFFFFF">Bedroom unit drips water. Gate code 2478.</textarea>
    </label>
  </div>

  <div style="background: #FFFFFF; border-top: 1px solid #E4E0D6; padding: 14px 20px 22px">
    <a href="C4-Provider.dc.html" style="height: 52px; border-radius: 14px; background: #0E5E56; color: #FFFFFF; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center">Find a provider · {{chosen}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { day: 1, slot: '10:00' }; }
  renderVals() {
    const days = [['Wed', '19'], ['Thu', '20'], ['Fri', '21'], ['Sat', '22'], ['Sun', '23']].map(([dow, num], i) => {
      const on = this.state.day === i;
      return { dow, num, on, border: on ? '#0E5E56' : '#FFFFFF', bg: on ? '#0E5E56' : '#FFFFFF', fg: on ? '#FFFFFF' : '#14211F', pick: () => this.setState({ day: i }) };
    });
    const closed = this.state.day === 0 ? ['08:00', '09:00', '10:00', '11:00'] : ['17:00'];
    const slots = ['08:00', '09:00', '10:00', '11:00', '13:00', '14:00', '15:00', '17:00'].map((t) => {
      const disabled = closed.indexOf(t) >= 0, on = !disabled && this.state.slot === t;
      return {
        t, on, disabled,
        border: on ? '#0E5E56' : '#E4E0D6',
        bg: disabled ? '#EEEDE8' : (on ? '#E3F0EC' : '#FFFFFF'),
        fg: disabled ? '#8A9391' : (on ? '#0E5E56' : '#14211F'),
        deco: disabled ? 'line-through' : 'none',
        pick: () => this.setState({ slot: t })
      };
    });
    const d = days[this.state.day];
    return { days, slots, chosen: d.dow + ' ' + d.num + ' Nov, ' + this.state.slot };
  }
}
</script>
</body>
</html>
