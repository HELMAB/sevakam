<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Incoming job</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<script src="dc-lite.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#F2B33D}a:hover{color:#FFD27A}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #14211F; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; padding: 28px 20px 24px; gap: 18px">
  <div style="display: flex; align-items: center; gap: 16px">
    <div style="position: relative; width: 84px; height: 84px; flex-shrink: 0">
      <svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true">
        <circle cx="42" cy="42" r="36" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="7"/>
        <circle cx="42" cy="42" r="36" fill="none" stroke="#F2B33D" stroke-width="7" stroke-linecap="round" stroke-dasharray="226" stroke-dashoffset="41" transform="rotate(-90 42 42)"/>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
        <span style="font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums">12:16</span>
        <span style="font-size: 10px; opacity: .75">left</span>
      </div>
    </div>
    <div>
      <div style="font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #F2B33D">New job request</div>
      <h1 style="margin: 4px 0 0; font-size: 26px; font-weight: 800; line-height: 1.15">Air-con · 2 services</h1>
    </div>
  </div>

  <section style="background: rgba(255,255,255,.07); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 12px; align-items: flex-start">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2B33D" stroke-width="1.8" stroke-linecap="round" style="flex-shrink: 0; margin-top: 2px" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <div><div style="font-weight: 700">Thu 20 Nov, 10:00</div><div style="font-size: 13px; opacity: .75">Tomorrow · fits your working hours</div></div>
    </div>
    <div style="display: flex; gap: 12px; align-items: flex-start">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2B33D" stroke-width="1.8" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px" aria-hidden="true"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
      <div><div style="font-weight: 700">St. 278, BKK1</div><div style="font-size: 13px; opacity: .75">2.8 km from your base</div></div>
    </div>
    <div style="height: 1px; background: rgba(255,255,255,.12)"></div>
    <div style="display: flex; justify-content: space-between; font-size: 14px"><span>General cleaning × 2</span><span style="font-variant-numeric: tabular-nums">$30.00</span></div>
    <div style="display: flex; justify-content: space-between; font-size: 14px"><span>Gas refill (R32) × 1</span><span style="font-variant-numeric: tabular-nums">$25.00</span></div>
    <div style="display: flex; gap: 8px">
      <div style="width: 56px; height: 56px; border-radius: 12px; background: #3A4B48; display: flex; align-items: flex-end; padding: 5px; font-size: 10px; font-weight: 600">Photo</div>
      <div style="width: 56px; height: 56px; border-radius: 12px; background: #4A5A50; display: flex; align-items: flex-end; padding: 5px; font-size: 10px; font-weight: 600">Photo</div>
      <div style="flex-grow: 1; font-size: 13px; opacity: .85; line-height: 1.4">"Bedroom unit drips water. Gate code 2478."</div>
    </div>
  </section>

  <div style="display: flex; justify-content: space-between; align-items: flex-end">
    <div>
      <div style="font-size: 13px; opacity: .75">Estimate</div>
      <div style="font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em">$55.00</div>
    </div>
    <div style="font-size: 13px; opacity: .75; text-align: right">≈ ៛225,500<br>no promotion</div>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <button style="height: 58px; border-radius: 16px; border: 0; background: #F2B33D; color: #14211F; font: 800 17px 'Plus Jakarta Sans', sans-serif">Accept job</button>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button style="height: 50px; border-radius: 14px; border: 1.5px solid rgba(255,255,255,.3); background: transparent; color: #FFFFFF; font: 700 15px 'Plus Jakarta Sans', sans-serif">Adjust price</button>
      <button style="height: 50px; border-radius: 14px; border: 1.5px solid rgba(255,255,255,.3); background: transparent; color: #FFFFFF; font: 700 15px 'Plus Jakarta Sans', sans-serif">Propose time</button>
    </div>
    <button style="height: 46px; border: 0; background: none; color: #F4A7A0; font: 700 15px 'Plus Jakarta Sans', sans-serif">Reject</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
