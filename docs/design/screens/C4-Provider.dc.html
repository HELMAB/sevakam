<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose provider</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<script src="dc-lite.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#0E5E56;text-decoration:none}a:hover{color:#0A4540}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #F6F4EF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #14211F; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 16px 20px 4px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="C3-Details.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14211F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
      <div>
        <h1 style="margin: 0; font-size: 22px; font-weight: 800">Choose a provider</h1>
        <div style="font-size: 13px; color: #5E6B68">Available Thu 20 Nov, 10:00 · covers BKK1</div>
      </div>
    </div>
    <div role="tablist" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #EAE6DC; border-radius: 14px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="height: 40px; border: 0; border-radius: 11px; background: {{t.bg}}; color: {{t.fg}}; font: 700 14px 'Plus Jakarta Sans', sans-serif; cursor: pointer">{{t.label}}</button>
      </sc-for>
    </div>
  </header>

  <div style="flex-grow: 1; overflow: hidden; padding: 12px 20px; display: flex; flex-direction: column; gap: 10px">
    <sc-if value="{{showMap}}" hint-placeholder-val="{{false}}">
      <div style="height: 300px; border-radius: 18px; background: #E8E4DA; position: relative; overflow: hidden">
        <div style="position: absolute; left: 0; right: 0; top: 90px; height: 14px; background: #FFFFFF"></div>
        <div style="position: absolute; left: 0; right: 0; top: 210px; height: 10px; background: #FFFFFF"></div>
        <div style="position: absolute; top: 0; bottom: 0; left: 110px; width: 12px; background: #FFFFFF"></div>
        <div style="position: absolute; top: 0; bottom: 0; left: 250px; width: 10px; background: #FFFFFF"></div>
        <div style="position: absolute; left: 230px; top: 0; width: 120px; height: 80px; background: #CFE0D8"></div>
        <div style="position: absolute; left: 160px; top: 130px; width: 22px; height: 22px; border-radius: 50%; background: #2B6CB0; border: 4px solid #FFFFFF"></div>
        <div style="position: absolute; left: 60px; top: 50px; height: 30px; padding: 0 10px; border-radius: 999px; background: #0E5E56; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center">Sokha · 2.1 km</div>
        <div style="position: absolute; left: 210px; top: 160px; height: 30px; padding: 0 10px; border-radius: 999px; background: #FFFFFF; color: #14211F; font-size: 12px; font-weight: 700; display: flex; align-items: center">Vannak · 2.8 km</div>
        <div style="position: absolute; left: 30px; top: 240px; height: 30px; padding: 0 10px; border-radius: 999px; background: #FFFFFF; color: #14211F; font-size: 12px; font-weight: 700; display: flex; align-items: center">Rithy · 3.6 km</div>
      </div>
      <p style="margin: 0; font-size: 12px; color: #5E6B68">Pins show each provider's base location, sorted by distance. Live location is only shared during a job.</p>
    </sc-if>
    <sc-for list="{{list}}" as="p" hint-placeholder-count="4">
      <button onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="text-align: left; background: #FFFFFF; border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; border: 2px solid {{p.border}}; font-family: 'Plus Jakarta Sans', sans-serif; color: #14211F; cursor: pointer">
        <div style="position: relative; flex-shrink: 0">
          <div style="width: 48px; height: 48px; border-radius: {{p.radius}}; background: {{p.bg}}; color: #FFFFFF; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center">{{p.init}}</div>
          <span style="position: absolute; left: -6px; top: -6px; width: 22px; height: 22px; border-radius: 50%; background: #14211F; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF">{{p.rank}}</span>
        </div>
        <div style="flex-grow: 1; min-width: 0">
          <div style="font-weight: 700; font-size: 15px">{{p.name}}</div>
          <div style="font-size: 12px; color: #5E6B68">{{p.sub}}</div>
          <div style="font-size: 12px; color: #14211F; display: flex; align-items: center; gap: 4px; margin-top: 2px">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="#F2B33D" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>{{p.meta}}
          </div>
        </div>
        <div style="text-align: right; flex-shrink: 0">
          <sc-if value="{{p.promo}}" hint-placeholder-val="{{false}}"><div style="font-size: 12px; color: #8A9391; text-decoration: line-through">$55.00</div></sc-if>
          <div style="font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums">{{p.price}}</div>
          <sc-if value="{{p.promo}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 700; background: #F2B33D; padding: 2px 6px; border-radius: 999px">−20%</span></sc-if>
        </div>
      </button>
    </sc-for>
  </div>

  <div style="background: #FFFFFF; border-top: 1px solid #E4E0D6; padding: 14px 20px 22px">
    <a href="C5-Review.dc.html" style="height: 52px; border-radius: 14px; background: #0E5E56; color: #FFFFFF; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center">Continue with {{chosen}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 1, pick: 'sokha' }; }
  renderVals() {
    const tabs = ['Companies', 'Top 5 techs', 'Map'].map((label, i) => ({
      label, on: this.state.tab === i, bg: this.state.tab === i ? '#FFFFFF' : 'transparent',
      fg: this.state.tab === i ? '#14211F' : '#5E6B68', pick: () => this.setState({ tab: i })
    }));
    const techs = [
      { id: 'sokha', init: 'SC', name: 'Sokha Chea', sub: 'CoolTech Co. · employee', meta: '4.9 (128) · 97% accept · 2.1 km', price: '$44.00', promo: true, bg: '#0E5E56' },
      { id: 'vannak', init: 'VP', name: 'Vannak Pich', sub: 'Freelancer', meta: '4.8 (96) · 94% accept · 2.8 km', price: '$55.00', promo: false, bg: '#7A4E00' },
      { id: 'rithy', init: 'RS', name: 'Rithy Sam', sub: 'MekongFix · employee', meta: '4.8 (210) · 89% accept · 3.6 km', price: '$55.00', promo: false, bg: '#1D4E89' },
      { id: 'bopha', init: 'BK', name: 'Bopha Keo', sub: 'Freelancer', meta: '4.7 (54) · 98% accept · 4.0 km', price: '$55.00', promo: false, bg: '#4B3C8F' },
      { id: 'dara', init: 'DM', name: 'Dara Meas', sub: 'Freelancer', meta: '4.6 (41) · 92% accept · 4.4 km', price: '$55.00', promo: false, bg: '#8F430A' }
    ];
    const companies = [
      { id: 'cooltech', init: 'CT', name: 'CoolTech Co.', sub: '12 technicians · owner assigns', meta: '4.8 (212) · 1.9 km', price: '$44.00', promo: true, bg: '#0E5E56' },
      { id: 'mekong', init: 'MF', name: 'MekongFix', sub: '8 technicians · owner assigns', meta: '4.7 (168) · 3.2 km', price: '$55.00', promo: false, bg: '#1D4E89' },
      { id: 'angkor', init: 'AS', name: 'Angkor Services', sub: '5 technicians · owner assigns', meta: '4.5 (77) · 5.0 km', price: '$55.00', promo: false, bg: '#7A2E3A' }
    ];
    const src = this.state.tab === 0 ? companies : (this.state.tab === 1 ? techs : techs.slice(0, 2));
    const list = src.map((p, i) => {
      const on = this.state.pick === p.id;
      return { ...p, on, rank: this.state.tab === 2 ? String.fromCharCode(65 + i) : i + 1, radius: this.state.tab === 0 ? '14px' : '50%', border: on ? '#0E5E56' : '#FFFFFF', pick: () => this.setState({ pick: p.id }) };
    });
    const all = techs.concat(companies), sel = all.find((x) => x.id === this.state.pick);
    return { tabs, list, showMap: this.state.tab === 2, chosen: sel ? sel.name.split(' ')[0] : '…' };
  }
}
</script>
</body>
</html>
