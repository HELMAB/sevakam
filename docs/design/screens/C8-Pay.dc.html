<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pay for job</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<script src="dc-lite.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#0E5E56;text-decoration:none}a:hover{color:#0A4540}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #F6F4EF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #14211F; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 16px 20px 8px; display: flex; align-items: center; gap: 12px">
    <a href="#" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14211F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div>
      <h1 style="margin: 0; font-size: 22px; font-weight: 800">Pay for your job</h1>
      <div style="font-size: 13px; color: #5E6B68">SV-24117 · completed by Sokha at 11:24</div>
    </div>
  </header>

  <div style="flex-grow: 1; overflow: hidden; padding: 10px 20px; display: flex; flex-direction: column; gap: 14px">
    <section style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <div>
          <h2 style="margin: 0; font-size: 15px; font-weight: 700">Use points</h2>
          <div style="font-size: 13px; color: #5E6B68">Balance 1,240 pts · up to 1,200 on this job</div>
        </div>
        <span style="font-size: 12px; font-weight: 700; background: #FCEFD2; color: #7A4E00; padding: 4px 8px; border-radius: 999px">100 pts = $1</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <button onClick="{{dec}}" aria-label="Use fewer points" style="width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid #E4E0D6; background: #FFFFFF; font: 700 20px 'Plus Jakarta Sans', sans-serif; color: #14211F; cursor: pointer">−</button>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; justify-content: space-between; font-weight: 700; font-variant-numeric: tabular-nums"><span>{{ptsLabel}}</span><span style="color: #0E5E56">{{discLabel}}</span></div>
          <div style="height: 8px; border-radius: 9px; background: #F0EDE6"><div style="height: 8px; border-radius: 9px; background: #F2B33D; width: {{barW}}"></div></div>
        </div>
        <button onClick="{{inc}}" aria-label="Use more points" style="width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid #E4E0D6; background: #FFFFFF; font: 700 20px 'Plus Jakarta Sans', sans-serif; color: #14211F; cursor: pointer">+</button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700">Payment method</h2>
      <sc-for list="{{methods}}" as="m" hint-placeholder-count="2">
        <button onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="text-align: left; background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; gap: 12px; align-items: center; border: 2px solid {{m.border}}; font-family: 'Plus Jakarta Sans', sans-serif; color: #14211F; cursor: pointer">
          <span style="width: 44px; height: 44px; border-radius: 12px; background: {{m.iconBg}}; color: {{m.iconFg}}; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center">{{m.badge}}</span>
          <span style="flex-grow: 1"><span style="display: block; font-weight: 700; font-size: 15px">{{m.title}}</span><span style="display: block; font-size: 13px; color: #5E6B68">{{m.sub}}</span></span>
          <span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid {{m.border}}; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{m.dot}}"></span></span>
        </button>
      </sc-for>
    </section>

    <section style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 8px; font-size: 14px">
      <div style="display: flex; justify-content: space-between"><span style="color: #5E6B68">Agreed price</span><span style="font-variant-numeric: tabular-nums">$60.00</span></div>
      <div style="display: flex; justify-content: space-between"><span style="color: #5E6B68">Points discount</span><span style="font-variant-numeric: tabular-nums; color: #0E5E56">{{discNeg}}</span></div>
      <div style="height: 1px; background: #F0EDE6; margin: 4px 0"></div>
      <div style="display: flex; justify-content: space-between; align-items: flex-end"><span style="font-weight: 700">To pay</span><span style="text-align: right"><span style="display: block; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums">{{total}}</span><span style="display: block; font-size: 13px; color: #5E6B68">{{khr}}</span></span></div>
      <div style="font-size: 13px; color: #7A4E00; background: #FCEFD2; border-radius: 10px; padding: 8px 10px">{{earn}}</div>
    </section>
  </div>

  <div style="background: #FFFFFF; border-top: 1px solid #E4E0D6; padding: 14px 20px 22px">
    <button style="width: 100%; height: 52px; border-radius: 14px; border: 0; background: #0E5E56; color: #FFFFFF; font: 700 15px 'Plus Jakarta Sans', sans-serif">{{cta}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pts: 1200, method: 'aba' }; }
  renderVals() {
    const max = 1200, pts = this.state.pts, disc = pts / 100, total = 60 - disc;
    const khr = Math.round(total * 4100 / 100) * 100;
    const methods = [
      { id: 'aba', badge: 'ABA', title: 'ABA PayWay', sub: 'ABA Mobile app or KHQR', iconBg: '#0B3A5B', iconFg: '#FFFFFF' },
      { id: 'cash', badge: '$', title: 'Cash to technician', sub: 'Sokha confirms when received', iconBg: '#E2F2E6', iconFg: '#1F6B3A' }
    ].map((m) => {
      const on = this.state.method === m.id;
      return { ...m, on, border: on ? '#0E5E56' : '#E4E0D6', dot: on ? '#0E5E56' : 'transparent', pick: () => this.setState({ method: m.id }) };
    });
    const money = '$' + total.toFixed(2);
    return {
      methods,
      dec: () => this.setState({ pts: Math.max(0, pts - 100) }),
      inc: () => this.setState({ pts: Math.min(max, pts + 100) }),
      ptsLabel: pts.toLocaleString('en-US') + ' pts',
      discLabel: '−$' + disc.toFixed(2),
      discNeg: '−$' + disc.toFixed(2),
      barW: Math.round(pts / max * 100) + '%',
      total: money,
      khr: '≈ ៛' + khr.toLocaleString('en-US'),
      earn: 'You’ll earn ' + Math.floor(total * 10) + ' points when this payment succeeds.',
      cta: this.state.method === 'aba' ? 'Pay ' + money + ' with ABA' : 'Pay ' + money + ' in cash'
    };
  }
}
</script>
</body>
</html>
