<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc46b"/>
      <stop offset="1" stop-color="#f29a1a"/>
    </linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f5a6e"/>
      <stop offset="1" stop-color="#0b3b4f"/>
    </linearGradient>
    <radialGradient id="glow" cx=".25" cy=".2" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>

  <!-- house -->
  <path d="M512 214 L812 466 A40 40 0 0 1 788 538 L760 538 L760 778 A48 48 0 0 1 712 826 L312 826 A48 48 0 0 1 264 778 L264 538 L236 538 A40 40 0 0 1 212 466 Z"
